; ============================================================
; CONFIGURAÇÃO DO PAINEL DE AVISOS
; Onde ficam a planilha e as mídias (imagens/vídeos).
;
; planilha: arquivo Excel com as abas Avisos, Salas e Configurações
; midia    : pasta das imagens e vídeos. Em branco = static\avisos
;
; Para usar a pasta de mídia na rede também, preencha por exemplo:
;   midia = Z:\PARTICULAR\Wallace Miguel\Painel de Avisos\midia
; ============================================================

; A linha "planilha" aceita mais de um caminho separados por  |
; (o painel usa o primeiro que existir). Exemplo:
;   planilha = Z:\PARTICULAR\...\avisos.xlsx | \\SERVIDOR\Rede\PARTICULAR\...\avisos.xlsx

[caminhos]
planilha = Z:\PARTICULAR\Wallace Miguel\Painel de Avisos\avisos.xlsx
midia =

; ============================================================
; CARD DE ATENDIMENTO (Messenger / Gestta)
; ativo          : sim / nao  (nao = esconde o card)
; intervalo      : de quantos em quantos segundos lê a página
; exibir_nomes   : sim           -> nome completo do contato
;                  primeiro_nome -> só o primeiro nome
;                  nao           -> só a quantidade (sem nomes)
; url_login      : página onde é feito o login (login_messenger.bat)
; navegador      : chrome (Google Chrome) ou msedge (Microsoft Edge)
; janela_visivel : sim = mostra a janela do navegador (para testes)
; ============================================================

[messenger]
ativo = sim
url = https://app.gestta.com.br/attendance/#/chat/pending
url_login = https://onvio.com.br/login/#/logout
intervalo = 10
exibir_nomes = sim
; departamentos: nomes que o painel procura em cada conversa pendente
; (separados por vírgula, escritos como devem aparecer na TV)
departamentos = Fiscal, Contábil, Departamento Pessoal, Pessoal, DP, Legalização, Societário, Paralegal, Financeiro, Comercial, Atendimento, RH, TI
navegador = chrome
janela_visivel = nao
; caminho do chrome.exe (só se o login_messenger.bat não achar o Chrome)
caminho_chrome =
